{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<div class="formpage"><p class="eyebrow">EVENT PLANNING</p><h1>Plan your party</h1><form class="card" method="post" action="/generate-party"><label>Budget ₹<input type="number" name="budget" min="1" required></label><label>Guests<input type="number" name="guests" min="1" value="30" required></label><label>Event type<input name="event_type" value="birthday" required></label><label>City<input name="city" value="Chennai"></label><label>Venue<input name="venue" value="Not decided"></label><label>Food preference<input name="food_preference" value="mixed"></label><label>Priorities<textarea name="priorities">food, decoration, entertainment</textarea></label><button>Generate party plan ✨</button></form></div>{% endblock %}
