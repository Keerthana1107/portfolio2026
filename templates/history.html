{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<p class="eyebrow">YOUR PLANS</p><h1>Recommendation history</h1>{% for x in history %}<div class="row"><b>{{x.planner|title}} Planner</b><span>{{x.created_at.strftime("%d %b %Y, %I:%M %p")}}</span><a href="/recommendations-details/{{x.id}}">View details</a></div>{% else %}<p class="empty">No saved plans.</p>{% endfor %}{% endblock %}
