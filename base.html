<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PocketSmart AI{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar">
    <a href="/dashboard" class="brand">PocketSmart <span>AI</span></a>
    {% if user %}
    <div class="nav-links">
        <a href="/home-planner">Home</a>
        <a href="/party-planner">Party</a>
        <a href="/jewelry-planner">Jewelry</a>
        <a href="/history">History</a>
        <span class="nav-user">Hi, {{ user.username }}</span>
        <button id="logoutBtn" class="btn-link">Logout</button>
    </div>
    {% endif %}
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
