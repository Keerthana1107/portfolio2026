{% extends "base.html" %}
{% block title %}Login - PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to PocketSmart AI</p>
    <form id="loginForm">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p id="loginError" class="error"></p>
    <p class="switch">No account? <a href="/register">Register here</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new URLSearchParams(new FormData(e.target));
    const res = await fetch('/token', { method: 'POST', body: form });
    if (res.ok) {
        window.location.href = '/dashboard';
    } else {
        const err = await res.json();
        document.getElementById('loginError').textContent = err.detail || 'Login failed';
    }
});
</script>
{% endblock %}
