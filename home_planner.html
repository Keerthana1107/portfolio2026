{% extends "base.html" %}
{% block title %}Home Planner - PocketSmart AI{% endblock %}
{% block content %}
<h1>🏠 Home Interior Budget Planner</h1>
<form id="homeForm" class="planner-form">
    <label>Total budget (₹)</label>
    <input type="number" name="total_budget" min="0" step="0.01" required>

    <div class="grid-2">
        <div><label>Number of lights</label><input type="number" name="num_lights" value="0" min="0"></div>
        <div><label>Number of fans</label><input type="number" name="num_fans" value="0" min="0"></div>
        <div><label>Furniture pieces</label><input type="number" name="num_furniture" value="0" min="0"></div>
        <div><label>Dining tables</label><input type="number" name="num_dining_tables" value="0" min="0"></div>
    </div>

    <label>Rooms</label>
    <div class="checkbox-row">
        <label><input type="checkbox" name="has_living_room"> Living room</label>
        <label><input type="checkbox" name="has_kitchen"> Kitchen</label>
        <label><input type="checkbox" name="has_bedroom"> Bedroom</label>
    </div>

    <label>Additional requirements</label>
    <textarea name="additional_requirements" rows="3" placeholder="e.g. prefer modern minimalist style"></textarea>

    <button type="submit" class="btn-primary">Get Recommendations</button>
</form>

<div id="loading" class="hidden">Generating recommendations…</div>
<div id="results"></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('homeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
        total_budget: parseFloat(fd.get('total_budget')),
        num_lights: parseInt(fd.get('num_lights') || 0),
        num_fans: parseInt(fd.get('num_fans') || 0),
        num_furniture: parseInt(fd.get('num_furniture') || 0),
        num_dining_tables: parseInt(fd.get('num_dining_tables') || 0),
        has_living_room: fd.get('has_living_room') === 'on',
        has_kitchen: fd.get('has_kitchen') === 'on',
        has_bedroom: fd.get('has_bedroom') === 'on',
        additional_requirements: fd.get('additional_requirements') || null
    };

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('results').innerHTML = '';

    const res = await fetch('/home-budget', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    document.getElementById('loading').classList.add('hidden');

    if (!res.ok) {
        const err = await res.json();
        document.getElementById('results').innerHTML = `<p class="error">${err.detail || 'Something went wrong'}</p>`;
        return;
    }
    const data = await res.json();
    renderResults(data);
});

function renderResults(data) {
    const container = document.getElementById('results');
    let html = `<h2>Budget: ₹${data.total_budget} &nbsp;|&nbsp; Remaining: ₹${data.remaining_budget ?? '—'}</h2>`;
    (data.budget_breakdown || []).forEach(cat => {
        html += `<div class="category-block"><h3>${cat.category} — ₹${cat.allocation}</h3><div class="item-grid">`;
        (cat.items || []).forEach(item => {
            html += `<div class="item-card">
                <h4>${item.name}</h4>
                <p>${item.description || ''}</p>
                <p class="price">₹${item.estimated_price} × ${item.quantity}</p>
                <div class="links">${Object.entries(item.shopping_links || {}).map(([site, url]) =>
                    `<a href="${url}" target="_blank">${site}</a>`).join(' ')}</div>
            </div>`;
        });
        html += `</div></div>`;
    });
    container.innerHTML = html;
}
</script>
{% endblock %}
